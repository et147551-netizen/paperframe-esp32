; Trace observer for the M5Capsule.
;
; A separate project rather than another env in the root platformio.ini: the Capsule
; is an ESP32-S3FN8 with 8 MB flash and NO PSRAM, while the M5Paper Color requires
; octal PSRAM. They cannot share a sdkconfig.defaults.
;
; There is no m5stack-capsule board definition in espressif32 6.12.0. m5stack-stamps3
; is the same silicon and the same 8 MB / no-PSRAM configuration, and declares espidf
; support, so it is used here. Only the GPIO numbers differ, and those are ours.
;
;   ~/.platformio/penv/Scripts/pio.exe run -d observer -e capsule -t upload

[env:capsule]
platform = espressif32 @ 6.12.0
board = m5stack-stamps3
framework = espidf

board_upload.flash_size = 8MB
monitor_speed = 115200
