; M5Paper Color (EL040EF1) — EPD refresh measurement harness.
;
; Derived from M5Stack's published PaperColor recipe, with the Arduino-only
; options dropped. See .scratch/phase0-preflight/issues/01-toolchain-and-skeleton.md
; for the full mapping and the rationale for each line.
;
; pio is not on PATH: ~/.platformio/penv/Scripts/pio.exe

[platformio]
; Optional and git-ignored. It carries the SMB credentials for env:smbprobe
; (ticket 23) so that no share password reaches the repository. A same-named
; [env:] section in it is merged over the one here. Absent, every env below still
; builds -- the probe just refuses to run and says why.
extra_configs = platformio_local.ini

[env:m5papercolor]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = espidf

; board_build.partitions is resolved relative to the PROJECT directory under
; framework = espidf. That is why naming M5's `default_16MB.csv` here fails — it
; lives in the Arduino package, which is not on that search path. Naming a csv
; that really is in the project works, and is in fact required:
;
; setting CONFIG_PARTITION_TABLE_CUSTOM in sdkconfig.defaults is NOT sufficient.
; PlatformIO generates its own `.pio/build/<env>/partitions.bin` from the board
; manifest and flashes that at 0x8000, ignoring the IDF-side config entirely.
; Verified 2026-08-31: with only the sdkconfig option set, the flashed table was
; still the esp32s3box default — 1 MB factory, no data partition — while
; sdkconfig.m5papercolor happily reported CONFIG_PARTITION_TABLE_CUSTOM=y.
; Both are set: this line decides what gets flashed, the sdkconfig option keeps
; the IDF build's own view consistent with it.
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

monitor_speed = 115200

; -DBOARD_M5PAPER_COLOR is on EVERY env including env:native, and it is what selects the
; board: src/board/board.h's #if chain picks the pin header, src/panel/epd_panel.h picks the
; panel, and each per-board .c compiles to nothing without it. There is NO DEFAULT -- the
; #else arm is an #error -- so an env that builds has selected a board, which is the only
; cheap check available given that compile_commands.json cannot see these flags at all.
;
; AND A LOCAL OVERRIDE WIPES IT. platformio_local.ini carries a same-named [env:] section for
; frame, smbprobe and gphotosprobe, and PlatformIO REPLACES `build_flags` rather than merging
; it -- so adding the board flag here reached eight envs and not those three. It cost one
; build to find, and only because the #error fired on the first file compiled; a default board
; would have produced a green build for the wrong hardware. Any local override must repeat
; both -DBOARD_<board> and -DBOARD_NO_POWER_OFF.
;
; -DBOARD_NO_POWER_OFF is likewise on every device env, not just this one. It makes
; board_pm1_write_reg() refuse PM1 SYS_CMD (0x0C), the register whose 0xA1 command
; powers the board off. That is unrecoverable without physically pressing the power
; button -- VBUS does not boot this device (issues/17) -- so it is refused in the
; driver rather than left to whoever is holding the register map. Tickets 15 and 16
; are the two that legitimately need it; they drop the flag deliberately, here.
;
; src/ holds more than one entry point and only one may define app_main.
;
; build_src_filter does NOT work here: under framework = espidf the sources come
; from src/CMakeLists.txt, which globs src/*.* and never sees PlatformIO's filter.
; Verified 2026-09-01 — the link failed with "multiple definition of `app_main'".
; So the selection is a compile-time flag instead, and each entry point guards its
; own body with it.
build_flags = -DBUILD_HARNESS -DBOARD_M5PAPER_COLOR -DBOARD_NO_POWER_OFF

; Hardware bring-up: I2C scan, PM1 rail, then a solid fill in each of the six valid
; colours, with a capture marker after each so the camera can be driven from the log.
[env:bringup]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_flags = -DBUILD_BRINGUP -DBOARD_M5PAPER_COLOR -DBOARD_NO_POWER_OFF

; The display pipeline end to end: decode, fit, dither, refresh, on three embedded
; images in three formats. Ticket .scratch/digital-frame/issues/07.
[env:photo]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_flags = -DBUILD_PHOTO -DBOARD_M5PAPER_COLOR -DBOARD_NO_POWER_OFF


; /data on the shared SPI bus: mount, scan, an image read off the filesystem, and a
; card read issued against a refresh in flight.
; Tickets .scratch/digital-frame/issues/03 and 08.
[env:storage]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_flags = -DBUILD_STORAGE -DBOARD_M5PAPER_COLOR -DBOARD_NO_POWER_OFF

; Host-side unit tests for the pure logic that can be verified without the
; panel: init-list transcription, frame packing, temperature codec, the FRS
; frame-rate model, CSV formatting.
[env:native]
platform = native
; No gcc on this machine; clang 22 is installed off PATH. See tools/native_toolchain.py.
extra_scripts = pre:tools/native_toolchain.py
; UNITY_INCLUDE_DOUBLE: without it Unity's double assertions do not compile away quietly,
; they fail the test with "Unity Double Precision Disabled". The epdoptimize port is double
; throughout (test/test_epdopt), so its assertions need this.
; One -I per layer directory the host build reaches into. Single-token flags only: the
; espidf builder sorts the flag list, so `-I src/core` as two tokens is dead on arrival
; (docs/agents/build-system.md). This env is a native build and does not go through that
; sorting, but keeping one form everywhere is cheaper than remembering which does.
build_flags = -std=c11 -Wall -Wextra -DHOST_TEST -Isrc -Isrc/core -Isrc/panel -Isrc/panel/el040ef1 -DBOARD_M5PAPER_COLOR -DUNITY_INCLUDE_DOUBLE
; Only src/core/ -- that directory is DEFINED as the ESP-IDF-free half, so this filter is
; now a statement about one directory rather than a hand-maintained list. Everything
; outside it pulls in esp_* headers.
build_src_filter = -<*> +<core/>
test_framework = unity
; pio test does not link project sources unless asked.
test_build_src = yes

; A colour chart held on the glass for hours while the camera watches it: settling
; after a refresh, drift, and cycle-to-cycle repeatability.
; Ticket .scratch/digital-frame/issues/20. env:colourchart_smoke below is the two
; minute version, and is run first: nothing multi-hour starts until a short version
; of the same firmware has produced a photograph and a parsed CSV row.
[env:colourchart]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_flags = -DBUILD_COLOURCHART -DBOARD_M5PAPER_COLOR -DBOARD_NO_POWER_OFF

; The same firmware, one cycle and three capture points. Its own env rather than an
; edited build_flags, so the long run cannot be started with the smoke schedule still
; compiled in.
[env:colourchart_smoke]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_flags = -DBUILD_COLOURCHART -DCOLOURCHART_SMOKE -DBOARD_M5PAPER_COLOR -DBOARD_NO_POWER_OFF

; The digital frame application: settings, Wi-Fi, web UI, slideshow.
; Tickets .scratch/digital-frame/issues/10-13.
;
; -DBOARD_NO_POWER_OFF stays on: FR-7 (RTC wake) and FR-8.2 (factory reset) both end
; in a PM1 power-off, and this device does not come back from one without a hand on
; the power button. Tickets 15 and 16 are where that flag legitimately comes off.
[env:frame]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_flags = -DBUILD_FRAME -DBOARD_M5PAPER_COLOR -DBOARD_NO_POWER_OFF
; Ticket 61: OTA accepts only images signed with the key the running one carries.
extra_scripts = post:tools/sign_firmware.py

; Ticket 18: which host pin carries the panel's reply to a register read.
; Prints raw bytes for five read variants across three panel states; decodes nothing.
[env:tempprobe]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_flags = -DBUILD_TEMPPROBE -DBOARD_M5PAPER_COLOR -DBOARD_NO_POWER_OFF

; Ticket 23: what an SMB2 session costs in internal RAM, measured before any of the
; mirror is written. Station-only -- no panel, no AP, no web server, no storage -- so
; the number is the SMB increment and not a mixture.
;
; Credentials are NOT in this file and must not be committed. They come from
; platformio_local.ini, which is git-ignored and pulled in by the `extra_configs`
; line at the top of this file; PlatformIO merges a same-named [env:] section over
; this one. The probe refuses to run without them, on purpose: a run against an open
; share cannot come out the other way, and that looks exactly like evidence.
;
;   ; platformio_local.ini
;   [env:smbprobe]
;   build_flags = -DBUILD_SMBPROBE -DBOARD_M5PAPER_COLOR -DBOARD_NO_POWER_OFF
;     -DSMBPROBE_WIFI_SSID='"..."' -DSMBPROBE_WIFI_PASS='"..."'
;     -DSMBPROBE_HOST='"..."' -DSMBPROBE_SHARE='"..."' -DSMBPROBE_PATH='"..."'
;     -DSMBPROBE_USER='"..."' -DSMBPROBE_PASS='"..."'
;
; THE TCP RECEIVE WINDOW IS AN ARM OF THIS ENV, AND IT IS COMMITTED AT ONE OF THEM.
; sdkconfig.smbprobe carries CONFIG_LWIP_TCP_WND_DEFAULT=16384 with
; CONFIG_LWIP_TCP_RECVMBOX_SIZE=16 -- ticket 23's condition, from commit 8796ee9, and the
; only place in this repository either value lives. sdkconfig.frame runs the shipping
; application at 5760/6. Both are valid conditions and they give different ANSWERS, not just
; different numbers: ticket 33 measured depths 1-16 all reading correctly at 16384/16 and
; every depth above 1 failing with "Wrong signature in received PDU" at 5760/6.
;
; So a run at the shipping window means editing all four lines in sdkconfig.smbprobe --
; CONFIG_LWIP_TCP_WND_DEFAULT and CONFIG_LWIP_TCP_RECVMBOX_SIZE, plus the deprecated
; CONFIG_TCP_WND_DEFAULT / CONFIG_TCP_RECVMBOX_SIZE aliases, which a build resyncs for you --
; and then PUTTING THEM BACK. On 2026-09-06 they were changed to 5760/6 for one arm and
; committed that way, which silently replaced ticket 23's condition in the repository; the
; commit after it restored them. Do not delete the file to reset it, for the reason
; docs/agents/build-system.md gives: nothing here comes from sdkconfig.defaults, so deleting it
; loses the 16384 outright.
;
; The firmware prints whichever pair it was built with (`wifi_init: tcp mbox:` in the boot
; log), so a capture carries its own validity condition rather than relying on the env name.
[env:smbprobe]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_flags = -DBUILD_SMBPROBE -DBOARD_M5PAPER_COLOR -DBOARD_NO_POWER_OFF

; Ticket 27: this board's TCP ceiling, which is the number ticket 23 measured around and
; explicitly did not explain -- 84 KB/s at ~45 ms per 4 KB round trip, "an order of
; magnitude below what the link can do". Station-only: no panel, no AP, no storage, no
; httpd, no SMB, so the figure is the transport rather than a mixture.
;
; RUN IT TWICE. The TCP receive window is the independent variable, not a detail:
; sdkconfig.frame carries CONFIG_LWIP_TCP_WND_DEFAULT=5760 (IDF stock) and
; sdkconfig.smbprobe carries 16384, because ticket 23 found 4 KB reads at 5760 stall every
; ~150-200 PDUs and that 4 KB + 16384 was the only no-stall row in its table. Two runs
; differing only there separate "lwIP's window" from every other candidate.
;
;   arm A: CONFIG_LWIP_TCP_WND_DEFAULT=5760  + CONFIG_LWIP_TCP_RECVMBOX_SIZE=6
;          (the shipping condition; mbox 6 is exactly right for 5760)
;   arm B: CONFIG_LWIP_TCP_WND_DEFAULT=16384 + CONFIG_LWIP_TCP_RECVMBOX_SIZE=16
;          (env:smbprobe's condition -- and BOTH lines are the condition)
;
; THE MAILBOX IS NOT OPTIONAL. IDF's components/lwip/Kconfig:690 requires
; CONFIG_LWIP_TCP_RECVMBOX_SIZE >= WND/MSS + 2 and says a full mailbox makes lwIP drop
; packets. Raising the window to 16384 while leaving the mailbox at its default 6 (the
; requirement is 13) was run on 2026-09-05 and collapsed the board's RECEIVE rate from
; 893 to 118 KB/s while its SEND rate doubled to 1821 -- a directional asymmetry that
; reads exactly like a hardware discovery and is a misconfiguration. The firmware prints
; the pair with the requirement computed, and says *** TOO SMALL *** when it is not met.
; Results and the account are in ticket 27.
;
; This file is committed at arm B (16384/16), matching env:smbprobe. For arm A, set both
; lines back to 5760 and 6.
;
; The value is edited in the GENERATED sdkconfig.iperf, which is how sdkconfig.smbprobe's
; 16384 got there and is picked up on the next build (espidf.py reconfigures when
; sdkconfig.<env> is newer than CMakeCache.txt). It is deliberately NOT put in
; sdkconfig.defaults: 16384 there would change env:frame's window with no measurement
; behind it, and 5760 there would reset env:smbprobe and destroy ticket 23's conditions.
; The firmware prints whichever value it was built with, so a capture carries its own
; validity condition instead of relying on the env name.
;
; The peer is tools/iperf_peer.py, started first and left running. Not iperf3: this
; component's server does no handshake, and there is no iperf binary on this PC anyway.
;
; -DIPERF_PEER_IP defaults to the bench PC at 192.168.1.10. Station credentials come from
; NVS when the Web UI has written them, and from -DIPERF_WIFI_SSID / -DIPERF_WIFI_PASS in
; git-ignored platformio_local.ini otherwise.
[env:iperf]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_flags = -DBUILD_IPERF -DBOARD_M5PAPER_COLOR -DBOARD_NO_POWER_OFF

; Ticket 60 gate B, and FR-10's gating number: what does ONE TLS session cost this board in
; internal RAM? The frame's site has Wi-Fi and nothing else, so no shape of the Google Photos
; requirement avoids HTTPS on this board -- which turns ticket 57 section 5's "the cheapest way
; to say no" into a number the design has to live within.
;
; Station-only on purpose: no panel, no AP, no mDNS, no httpd, no storage, no SMB, so the figure
; is the TLS increment and not a mixture. THE COMBINED CASE -- a fetch while httpd, the mirror
; and a refresh are live -- IS NOT THIS ENV AND IS THE ONE THAT DECIDES THE FEATURE. This arm is
; first because if the increment alone does not fit, the combined case cannot.
;
; NOTHING HERE IS EDITED IN sdkconfig. The certificate bundle is already on
; (CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y, FULL, 200 certs) and nothing in sdkconfig.defaults
; touches mbedTLS or lwIP -- so the generated sdkconfig.gphotosprobe takes IDF's defaults,
; which are CONFIG_LWIP_TCP_WND_DEFAULT=5760 with CONFIG_LWIP_TCP_RECVMBOX_SIZE=6. That is the
; SHIPPING condition, the same pair sdkconfig.frame carries, and it is the condition this arm
; wants -- unlike env:smbprobe, which is committed at 16384/16 for ticket 23's reasons.
; The firmware prints the pair it was built with, so a capture carries its own validity
; condition rather than relying on the env name.
;
; The two knobs to reach for if the answer is "it does not fit", in this order:
;   1. GPHOTOSPROBE_HTTP_BUF -- esp_http_client's receive buffer, internal RAM, default 2048.
;   2. CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN / _OUT_ -- 16384/4096 today. Editing these means
;      deleting the build directory (docs/agents/build-system.md) and re-taking every figure;
;      do not quote a number from before the change.
;
; URLS AND CREDENTIALS ARE BUILD FLAGS AND NOTHING IS COMMITTED. A share `key` is a bearer
; capability to the whole album and a photo URL fetches a photograph to anyone holding it, so
; they live in git-ignored platformio_local.ini and the firmware never prints either:
;
;   [env:gphotosprobe]
;   build_flags = -DBUILD_GPHOTOSPROBE -DBOARD_M5PAPER_COLOR -DBOARD_NO_POWER_OFF
;     -DGPHOTOSPROBE_WIFI_SSID='"..."' -DGPHOTOSPROBE_WIFI_PASS='"..."'
;     -DGPHOTOSPROBE_URL='"https://photos.google.com/share/AF1Qip...?key=..."'
;     -DGPHOTOSPROBE_IMG_URL='"https://lh3.googleusercontent.com/pw/...=w400-h600-c"'
;
; GPHOTOSPROBE_URL must be the RESOLVED share URL, not the photos.app.goo.gl short link: that
; redirects with a plain 302 (measured on the PC side, 2026-09-12) and following it is one more
; session of the same shape, not this arm's question.
[env:gphotosprobe]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_flags = -DBUILD_GPHOTOSPROBE -DBOARD_M5PAPER_COLOR -DBOARD_NO_POWER_OFF

; The digital frame on the Seeed reTerminal E1002. Ticket .scratch/digital-frame/issues/43's
; port, layered in on 2026-09-15; ticket 63 is the bring-up.
;
; THIS HAS NEVER RUN. Every board and panel constant it compiles is read from
; refs/esp32-photoframe (MIT, HEAD bf02982) rather than measured, and no board of this kind has
; been on this bench. A green build here proves that the layering holds and the code compiles at
; 800x480 -- nothing more. Do not quote a timing, colour or refresh figure for this board.
;
; What differs from env:frame, and it is only these four lines: the board flag, 32 MB of flash,
; its own partition table (partitions_e1002.csv says why it is not partitions.csv), and
; consequently its own generated sdkconfig. Everything above the board and panel layers is the
; same source.
;
; -DBOARD_NO_POWER_OFF STAYS ON even though there is no PM1 here. The guardrail is about the
; CLASS of action -- "leaves a device no software anywhere can bring back" -- not about a
; particular register, and this board's power-off and deep-sleep paths are the local instances
; of it. src/board/reterminal_e1002/ must honour the flag for the same reason board_pm1.c does.
;
; ONE sdkconfig VALUE HAS TO BE EDITED IN THE GENERATED FILE and a build will not do it for you:
; CONFIG_ESPTOOLPY_FLASHSIZE. sdkconfig.defaults carries 16MB for the M5Paper Color, so the
; first build of this env generates sdkconfig.frame_e1002 with 16MB in it and the 32 MB table
; above then does not fit. Set CONFIG_ESPTOOLPY_FLASHSIZE_32MB=y, clear the 16MB line and set
; CONFIG_ESPTOOLPY_FLASHSIZE="32MB" in sdkconfig.frame_e1002, by Edit and not sed -i.
;
; The three sdkconfig lines that LOOK board-specific and are not: CONFIG_SPIRAM_CLK_IO=30 and
; CONFIG_SPIRAM_CS_IO=26 in sdkconfig.defaults are ESP-IDF's own ESP32-S3 defaults and are not
; even user-settable (components/esp_psram/esp32s3/Kconfig.spiram:41-47 declares them `int` with
; no prompt), so they are no-ops on both boards. This comment exists because they were flagged as
; the port's biggest hidden leak before anyone read that Kconfig. CONFIG_SPIRAM_SPEED_40M is a
; real choice and is LEFT ALONE: it came verbatim from M5's own demo, the reference firmware runs
; this board at 80M, and changing it here would be a tuning with no measurement behind it on a
; board nobody has run.
[env:frame_e1002]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = espidf
board_build.partitions = partitions_e1002.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
monitor_speed = 115200
build_flags = -DBUILD_FRAME -DBOARD_RETERMINAL_E1002 -DBOARD_NO_POWER_OFF
extra_scripts = post:tools/sign_firmware.py

; Hardware bring-up on the reTerminal E1002: I2C scan on both buses, then a solid fill in each of
; the six valid colours with a capture marker after each. Ticket 63's arms 1 and 2.
;
; THIS IS THE FIRST FIRMWARE THIS PROJECT PUTS ON THAT BOARD, and it exists rather than starting
; from env:frame_e1002 because that env brings up Wi-Fi, httpd, the mirror and the slideshow at
; once. Ticket 63 requires the panel's three suspect constants -- the init list's order, the 20 MHz
; SPI clock and the 32 KB frame chunk -- to be changed ONE AT A TIME, and a blank panel can only
; be attributed to one of them from a build that has nothing else running.
;
; TWO sdkconfig VALUES HAVE TO BE HAND-EDITED IN THE GENERATED sdkconfig.bringup_e1002, and a
; build will not do either for you:
;   * CONFIG_ESPTOOLPY_FLASHSIZE_32MB=y, for the same reason as env:frame_e1002 above.
;   * THE CONSOLE. The E1002's USB-C goes to a CH340C -- measured 2026-09-17, and confirmed on the
;     V1.2 schematic, which wires U0RXD/U0TXD to it along with the DTR/RTS reset-and-boot pair.
;     sdkconfig.defaults forces CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG for the M5Paper Color, whose
;     console really is native, so an E1002 built from it runs perfectly and prints NOTHING. Set
;     CONFIG_ESP_CONSOLE_UART_DEFAULT=y with CONFIG_ESP_CONSOLE_SECONDARY_USB_SERIAL_JTAG=y here
;     and in sdkconfig.frame_e1002; do not touch sdkconfig.defaults, which would move every
;     M5Paper Color env with no measurement behind it.
[env:bringup_e1002]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = espidf
board_build.partitions = partitions_e1002.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
monitor_speed = 115200
build_flags = -DBUILD_BRINGUP -DBOARD_RETERMINAL_E1002 -DBOARD_NO_POWER_OFF

; The host tests at the reTerminal E1002's geometry. Same sources as env:native, one flag
; different -- and that is the acceptance test for the whole layering pass: if src/core/ still
; passes 800x480 with nothing but a board flag changed, the portable half really is portable.
;
; It also covers the ED2208-GCA init list, which test_epd_core selects on the same flag. Note
; what that check is and is not: the EL040EF1's golden list was transcribed a SECOND time,
; independently, from M5GFX's own source, so a mismatch there means somebody made a typo. The
; ED2208-GCA literal comes from the same third-party file as the driver, so it is a
; transcription check and not a cross-check. It cannot catch that file being wrong.
[env:native_e1002]
platform = native
extra_scripts = pre:tools/native_toolchain.py
build_flags = -std=c11 -Wall -Wextra -DHOST_TEST -Isrc -Isrc/core -Isrc/panel -Isrc/panel/ed2208gca -DBOARD_RETERMINAL_E1002 -DUNITY_INCLUDE_DOUBLE
build_src_filter = -<*> +<core/>
test_framework = unity
test_build_src = yes
